server {
    listen 80;
    server_name _;
    # Plain HTTP just redirects - the whole point of this proxy existing
    # is to make sure nothing talks to the backend over anything but TLS,
    # since that's what the refresh-token cookie's `secure` flag requires
    # (authController.js) once NODE_ENV=production.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Real-time connections (Phase 8) need the Upgrade/Connection headers
    # forwarded, or nginx serves them as plain HTTP and the WebSocket
    # handshake fails.
    location /socket.io/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|uploads|api-docs) {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=1 (backend/src/app.js) makes Express read this to
        # compute req.ip correctly - get this wrong and rate limiting
        # either shares one bucket across every client or trusts a
        # client-supplied IP outright (see app.js's TRUST_PROXY comment).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # authController.js's cookie `secure` flag is about the
        # *browser<->proxy* leg (this connection, genuinely HTTPS) - the
        # proxy<->backend leg being plain HTTP is fine and normal; the
        # backend itself never terminates TLS. X-Forwarded-Proto tells it
        # what scheme the original client actually used, for anything that
        # needs to know rather than assume.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
