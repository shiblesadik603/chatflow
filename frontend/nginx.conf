server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Client-side routing (react-router-dom) - any path that isn't a
        # real file falls back to index.html so the app's own router
        # handles it, instead of nginx 404ing on e.g. a hard refresh of
        # /chat or /dashboard.
        try_files $uri /index.html;
    }
}
