services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - uploads_data:/app/uploads
    environment:
      # Deliberately not "production" - the refresh-token cookie's secure
      # flag (authController.js) only gets sent by the browser over real
      # HTTPS, which this local Compose stack doesn't terminate. Running
      # as "production" here would silently break login. Real production
      # TLS/proxy setup is Phase 25's job, not this one.
      NODE_ENV: development
      PORT: 5001
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb://mongo:27017/chatflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRES_IN: 30d
      # The URL the *browser* fetches uploaded files from, not a
      # container-to-container address - stays on localhost since that's
      # where the published port lands.
      PUBLIC_URL: http://localhost:5001
      UPLOAD_DIR: uploads
      TRUST_PROXY: 0

  frontend:
    build:
      context: ./frontend
      args:
        # Also browser-facing, not container-to-container - see the
        # Dockerfile comment on why this has to be a build arg.
        VITE_API_URL: http://localhost:5001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
  redis_data:
  uploads_data:
